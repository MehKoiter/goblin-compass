# Builds the addon zip and publishes it whenever a version tag (e.g. v0.9) is pushed.
# - GitHub release: always (uses the built-in GITHUB_TOKEN).
# - CurseForge: needs the CF_API_KEY secret (repo Settings > Secrets and variables > Actions).
#   The project ID comes from "## X-Curse-Project-ID" in the TOC; the optional
#   CURSEFORGE_PROJECT_ID repo variable overrides it.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so the changelog can list commits since the last tag

      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ vars.CURSEFORGE_PROJECT_ID != '' && format('-p {0}', vars.CURSEFORGE_PROJECT_ID) || '' }}
